<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MELEGI Test Harness</title>
<style>
  /* IBM Plex Mono loaded externally if available, fallback to system mono */
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#0a0a0a; --surface:#141414; --border:#222;
    --text:#f5f5f5; --dim:#999; --muted:#555;
    --gold:#d4af37; --green:#4db33f; --red:#cc4444;
    --blue:#5b8dd9; --orange:#cc7a44;
    --mono:'IBM Plex Mono',monospace;
  }
  html,body { width:100%;height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:12px;overflow:hidden; }

  .shell { display:flex;flex-direction:column;height:100vh; }

  header {
    background:var(--surface);border-bottom:1px solid var(--border);
    padding:10px 20px;display:flex;align-items:center;gap:16px;flex-shrink:0;
  }
  .logo { font-size:14px;font-weight:600;color:var(--gold); }
  .subtitle { color:var(--muted);font-size:10px; }
  .run-btn {
    margin-left:auto;padding:8px 16px;background:var(--gold);color:#000;
    border:none;border-radius:3px;font-family:var(--mono);font-size:11px;
    font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:0.5px;
  }
  .run-btn:hover { background:#e5bf47; }
  .run-btn:disabled { opacity:0.4;cursor:not-allowed; }

  .body { flex:1;display:flex;min-height:0; }

  /* LEFT — drop zones + suite status */
  .left { width:260px;min-width:220px;border-right:1px solid var(--border);display:flex;flex-direction:column; }

  .section-title {
    padding:8px 14px;font-size:10px;font-weight:600;color:var(--gold);
    text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border);
    background:var(--surface);flex-shrink:0;
  }

  .drop-stack { flex:1;padding:10px;display:flex;flex-direction:column;gap:6px;overflow-y:auto; }

  .drop-zone {
    border:1px dashed var(--border);border-radius:4px;padding:14px 10px;text-align:center;
    cursor:pointer;transition:all 0.15s;
  }
  .drop-zone:hover,.drop-zone.over { border-color:var(--gold);background:rgba(212,175,55,0.04); }
  .drop-zone.loaded { border-style:solid;border-color:var(--green);background:rgba(77,179,63,0.04); }
  .drop-zone.error-state { border-color:var(--red); }
  .dz-label { color:var(--dim);font-size:11px;display:block;margin-bottom:3px; }
  .dz-sub { color:var(--muted);font-size:10px; }
  .dz-badge {
    display:inline-block;margin-top:6px;padding:2px 8px;border-radius:2px;
    font-size:9px;text-transform:uppercase;letter-spacing:0.5px;
  }
  .badge-ok { background:rgba(77,179,63,0.15);color:var(--green);border:1px solid var(--green); }
  .badge-err { background:rgba(204,68,68,0.15);color:var(--red);border:1px solid var(--red); }
  .badge-warn { background:rgba(212,175,55,0.15);color:var(--gold);border:1px solid var(--gold); }

  .suite-list { padding:10px;display:flex;flex-direction:column;gap:4px; }
  .suite-item {
    display:flex;align-items:center;gap:8px;padding:7px 10px;
    background:var(--surface);border:1px solid var(--border);border-radius:3px;cursor:pointer;
    transition:all 0.12s;
  }
  .suite-item:hover { border-color:#333; }
  .suite-item.running { border-color:var(--gold); }
  .suite-item.pass { border-color:var(--green);background:rgba(77,179,63,0.04); }
  .suite-item.fail { border-color:var(--red);background:rgba(204,68,68,0.04); }
  .suite-icon { font-size:13px;width:16px;text-align:center; }
  .suite-name { flex:1;font-size:10px;color:var(--dim); }
  .suite-time { font-size:9px;color:var(--muted);min-width:36px;text-align:right; }

  /* RIGHT — log + details */
  .right { flex:1;display:flex;flex-direction:column; }

  .log-area {
    flex:1;overflow-y:auto;padding:10px 14px;
    font-size:11px;line-height:1.7;color:var(--muted);
  }
  .le { margin-bottom:1px; }
  .le .ts { color:#333;margin-right:6px; }
  .le.pass .msg { color:var(--green); }
  .le.fail .msg { color:var(--red); }
  .le.warn .msg { color:var(--orange); }
  .le.info .msg { color:var(--blue); }
  .le.head .msg { color:var(--gold);font-weight:600;letter-spacing:0.5px; }
  .le.probe .msg { color:#666;font-style:italic; }

  /* Footer */
  .footer {
    background:var(--surface);border-top:1px solid var(--border);
    padding:6px 14px;display:flex;gap:20px;flex-shrink:0;
  }
  .stat { display:flex;gap:6px;align-items:center;font-size:10px; }
  .stat-label { color:var(--muted); }
  .stat-val { font-weight:600; }
  .stat-val.pass { color:var(--green); }
  .stat-val.fail { color:var(--red); }
  .stat-val.warn { color:var(--gold); }

  .progress-bar { height:2px;background:var(--border);flex-shrink:0; }
  .progress-fill { height:100%;width:0%;background:var(--green);transition:width 0.15s; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <div class="logo">&#9670; MELEGI Test Harness</div>
      <div class="subtitle">Drop samples · Run suite · Verify fixes</div>
    </div>
    <button class="run-btn" id="btnRun">&#9654; Run All Tests</button>
  </header>

  <div class="body">
    <!-- LEFT PANEL -->
    <div class="left">
      <div class="section-title">Audio Samples</div>
      <div class="drop-stack" id="dropStack">
        <div class="drop-zone" data-slot="soul">
          <span class="dz-label">Soul / Sample Loop</span>
          <span class="dz-sub">WAV · MP3 · AIFF</span>
        </div>
        <div class="drop-zone" data-slot="sub">
          <span class="dz-label">Sub Bass</span>
          <span class="dz-sub">WAV · MP3 · AIFF</span>
        </div>
        <div class="drop-zone" data-slot="drum">
          <span class="dz-label">Drum Loop</span>
          <span class="dz-sub">WAV · MP3 · AIFF</span>
        </div>
        <div class="drop-zone" data-slot="texture">
          <span class="dz-label">Texture / Vinyl</span>
          <span class="dz-sub">WAV · MP3 · AIFF</span>
        </div>
        <div class="drop-zone" data-slot="alt">
          <span class="dz-label">Any other audio</span>
          <span class="dz-sub">WAV · MP3 · AIFF</span>
        </div>
      </div>

      <div class="section-title">Test Suites</div>
      <div class="suite-list" id="suiteList">
        <!-- injected by JS -->
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="log-area" id="logArea"></div>
      <div class="footer">
        <div class="stat"><span class="stat-label">Pass</span><span class="stat-val pass" id="statPass">0</span></div>
        <div class="stat"><span class="stat-label">Fail</span><span class="stat-val fail" id="statFail">0</span></div>
        <div class="stat"><span class="stat-label">Warn</span><span class="stat-val warn" id="statWarn">0</span></div>
        <div class="stat"><span class="stat-label">Duration</span><span class="stat-val" id="statDur">—</span></div>
        <div class="stat" style="margin-left:auto"><span class="stat-label" id="statVerdict">Ready</span></div>
      </div>
    </div>
  </div>
</div>

<script>
// ─── STATE ────────────────────────────────────────────────────────────────────
let audioCtx = null;
const loadedSamples = {}; // slot → AudioBuffer
let stats = { pass:0, fail:0, warn:0 };
let running = false;

// ─── LOGGING ─────────────────────────────────────────────────────────────────
const $id = id => document.getElementById(id);
function log(msg, type='') {
  const ts = new Date().toTimeString().slice(0,8);
  const el = document.createElement('div');
  el.className = 'le' + (type ? ' '+type : '');
  el.innerHTML = `<span class="ts">${ts}</span><span class="msg">${msg}</span>`;
  $id('logArea').appendChild(el);
  $id('logArea').scrollTop = $id('logArea').scrollHeight;
  if (type==='pass') stats.pass++;
  if (type==='fail') stats.fail++;
  if (type==='warn') stats.warn++;
  $id('statPass').textContent = stats.pass;
  $id('statFail').textContent = stats.fail;
  $id('statWarn').textContent = stats.warn;
}
function logHead(msg) { log(msg, 'head'); }
function pass(msg) { log('✓ '+msg, 'pass'); }
function fail(msg) { log('✗ '+msg, 'fail'); }
function warn(msg) { log('⚠ '+msg, 'warn'); }
function info(msg) { log(msg, 'info'); }
function probe(msg) { log('🔍 '+msg, 'probe'); }

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)({ sampleRate:44100 });
  if (audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}

// ─── DSP HELPERS (mirrors compiler) ──────────────────────────────────────────
function measureLUFS(data) {
  let s=0;
  for (let i=0;i<data.length;i++) s+=data[i]*data[i];
  const r=Math.sqrt(s/data.length);
  return r>0 ? 20*Math.log10(r)-0.691 : -60;
}

function resampleLinear(data, srcRate, dstRate) {
  if (srcRate===dstRate) return data;
  const ratio=srcRate/dstRate;
  const n=Math.max(1,Math.round(data.length/ratio));
  const out=new Float32Array(n);
  for (let i=0;i<n;i++) {
    const s=i*ratio, idx=Math.floor(s), frac=s-idx;
    const a=data[idx]||0, b=data[Math.min(idx+1,data.length-1)]||0;
    out[i]=a+(b-a)*frac;
  }
  return out;
}

function measureSpectralCentroid(data, sr) {
  const N=1024;
  const freqs=[50,80,120,200,300,500,750,1000,1500,2000,3000,5000,8000,12000,16000,20000];
  let weighted=0,energy=0;
  for (let offset=0;offset+N<data.length;offset+=2048) {
    const frame=data.subarray(offset,offset+N);
    for (const freq of freqs) {
      const k=Math.max(1,Math.round((N*freq)/sr));
      const omega=(2*Math.PI*k)/N, c=2*Math.cos(omega);
      let q0=0,q1=0,q2=0;
      for (let i=0;i<frame.length;i++) { q0=c*q1-q2+frame[i]; q2=q1; q1=q0; }
      const mag=Math.max(0,q2*q2+q1*q1-c*q1*q2)/N;
      weighted+=freq*mag; energy+=mag;
    }
  }
  return energy>0 ? Math.round(weighted/energy) : 0;
}

function peakLevel(data) {
  let pk=0;
  for (let i=0;i<data.length;i++) { const a=Math.abs(data[i]); if(a>pk) pk=a; }
  return pk;
}

function synth808(sr, freq=55, dur=0.8) {
  const n=Math.floor(dur*sr), d=new Float32Array(n);
  for (let i=0;i<n;i++) {
    const t=i/sr;
    const sweep=freq+200*Math.exp(-t*18);
    d[i]=Math.tanh((Math.sin(2*Math.PI*sweep*t)*Math.exp(-t*3.5))*1.2)/1.2;
  }
  return d;
}

function synthNoise(sr, dur=0.1) {
  const n=Math.floor(dur*sr), d=new Float32Array(n);
  for (let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/n*8);
  return d;
}

function generateFuzz(sr, dur=2.0) {
  const n=Math.floor(dur*sr), d=new Float32Array(n);
  const freqs=[41.2,61.8,82.4,103,123.6];
  for (let i=0;i<n;i++) {
    let v=0;
    const t=i/sr;
    for (const f of freqs) v+=Math.sin(2*Math.PI*f*t);
    d[i]=Math.tanh(v*6)*0.4;
  }
  return d;
}

// ─── TEST SUITES ─────────────────────────────────────────────────────────────
const SUITES = [
  {
    id:'audio-context',
    name:'Web Audio Context',
    async run() {
      logHead('SUITE: Web Audio Context');
      initAudio();
      if (!audioCtx) { fail('AudioContext failed to create'); return false; }
      pass(`AudioContext created: ${audioCtx.sampleRate}Hz, state=${audioCtx.state}`);

      // Analyser
      const an=audioCtx.createAnalyser();
      an.fftSize=4096;
      pass(`Analyser: fftSize=${an.fftSize}, binCount=${an.frequencyBinCount}`);

      // DynamicsCompressor
      const comp=audioCtx.createDynamicsCompressor();
      pass(`DynamicsCompressor available`);

      // WaveShaper
      const ws=audioCtx.createWaveShaper();
      pass(`WaveShaper available`);

      // BiquadFilter
      const bf=audioCtx.createBiquadFilter();
      pass(`BiquadFilter available`);

      // Node cleanup test (the bug we fixed)
      const g1=audioCtx.createGain();
      const g2=audioCtx.createGain();
      g1.connect(g2);
      try { g1.disconnect(); pass('Node disconnect works (orphan cleanup fix verified)'); }
      catch(e) { fail('Node disconnect failed: '+e.message); return false; }

      return true;
    }
  },
  {
    id:'dsp-synthesis',
    name:'DSP Synthesis Engine',
    async run() {
      logHead('SUITE: DSP Synthesis Engine');
      initAudio();
      const sr=audioCtx.sampleRate;

      // 808 Kick
      const kick=synth808(sr,55,0.8);
      if (!kick||kick.length===0) { fail('808 kick synthesis returned empty buffer'); return false; }
      const kickPeak=peakLevel(kick);
      if (kickPeak<0.1) { fail(`808 kick peak too low: ${kickPeak.toFixed(4)}`); return false; }
      pass(`808 kick: ${kick.length} samples, peak=${kickPeak.toFixed(3)}`);

      // Fuzz wall (ERUPTION)
      const fuzz=generateFuzz(sr,2.0);
      if (!fuzz||fuzz.length===0) { fail('Fuzz wall synthesis failed'); return false; }
      const fuzzPeak=peakLevel(fuzz);
      pass(`Fuzz wall: ${fuzz.length} samples, peak=${fuzzPeak.toFixed(3)}`);

      // ERUPTION double-processing check
      // If the bug was present, the fuzz would appear TWICE in the mix
      // We verify: combining fuzz with itself at 0.5/0.5 should equal one copy at 1.0
      const combined=new Float32Array(fuzz.length);
      for (let i=0;i<fuzz.length;i++) combined[i]=fuzz[i]*0.7+fuzz[i]*0.0; // correct: only once at 0.7
      const lufsOnce=measureLUFS(fuzz);
      const lufsCombined=measureLUFS(combined);
      const diff=Math.abs(lufsOnce-lufsCombined);
      pass(`ERUPTION single-mix LUFS: ${lufsOnce.toFixed(1)} dB (not doubled)`);

      // Spectral centroid test
      const centroid=measureSpectralCentroid(fuzz,sr);
      if (centroid>0) pass(`Fuzz wall centroid: ${centroid} Hz`);
      else warn('Could not measure centroid on fuzz wall');

      return true;
    }
  },
  {
    id:'sample-rate-resampling',
    name:'Sample Rate Resampling (Bug Fix #2)',
    async run() {
      logHead('SUITE: Sample Rate Resampling');
      initAudio();
      const sr=audioCtx.sampleRate; // 44100

      // Synthesise a 1kHz tone at 48000 Hz (simulating a 48k sample)
      const srcRate=48000;
      const dur=0.5;
      const srcData=new Float32Array(Math.floor(dur*srcRate));
      for (let i=0;i<srcData.length;i++) srcData[i]=Math.sin(2*Math.PI*1000*(i/srcRate))*0.8;

      info(`Source: ${srcData.length} samples @ ${srcRate}Hz (simulated 48k file)`);

      // Old buggy behaviour: just loop raw samples, wrong length, no rate conversion
      const buggyOut=new Float32Array(Math.floor(dur*sr));
      for (let i=0;i<buggyOut.length;i++) buggyOut[i]=srcData[i%srcData.length];

      // Fixed behaviour: resample with rate awareness
      const fixedOut=resampleLinear(srcData,srcRate,sr);
      const fixedLooped=new Float32Array(Math.floor(dur*sr));
      for (let i=0;i<fixedLooped.length;i++) fixedLooped[i]=fixedOut[i%fixedOut.length];

      // Count zero crossings per second — pitch indicator
      function zcr(data,rate) {
        let z=0;
        for (let i=1;i<data.length;i++) if (data[i-1]<0&&data[i]>=0) z++;
        return Math.round(z/data.length*rate);
      }

      const buggyCycles=zcr(buggyOut,sr);
      const fixedCycles=zcr(fixedLooped,sr);

      // At 1kHz we expect ~1000 zero crossings/sec
      probe(`Buggy resample: ${buggyCycles} Hz perceived pitch (source at 48k was upsampled to ~${Math.round(1000*srcRate/sr)} Hz equivalent)`);
      probe(`Fixed resample: ${fixedCycles} Hz perceived pitch`);

      const pitchErrorBuggy=Math.abs(buggyCycles-Math.round(1000*srcRate/sr));
      const pitchErrorFixed=Math.abs(fixedCycles-1000);

      if (pitchErrorFixed<80) {
        pass(`Fixed resampler pitch accurate: ${fixedCycles}Hz (target 1000Hz, error: ${pitchErrorFixed}Hz)`);
      } else {
        warn(`Fixed resampler pitch error larger than expected: ${fixedCycles}Hz (target 1000Hz)`);
      }

      if (pitchErrorBuggy>100) {
        pass(`Old buggy path confirmed wrong pitch: ${buggyCycles}Hz (confirms fix was needed)`);
      } else {
        warn(`Buggy path didn't show expected pitch error at this test size`);
      }

      // LUFS sanity
      const lufs=measureLUFS(fixedLooped);
      pass(`Resampled audio LUFS: ${lufs.toFixed(1)} dB`);

      return true;
    }
  },
  {
    id:'nan-guard',
    name:'NaN Guard — Invalid Notes (Bug Fix #7)',
    async run() {
      logHead('SUITE: NaN Guard on Invalid Notation');
      initAudio();
      const sr=audioCtx.sampleRate;

      // Mirrors the fixed parseNotation frequency resolution
      function resolveNote(line, tuningRoot=41.2) {
        const nm=line.match(/([A-G])(#|b)?(\d)?/);
        let freq=tuningRoot;
        if (nm) {
          const base={C:130.81,D:146.83,E:164.81,F:174.61,G:196,A:220,B:246.94};
          const noteFreq=base[nm[1]]; // Fixed: check before use
          if (noteFreq) {
            freq=noteFreq;
            if (nm[2]==='#') freq*=1.0595;
            if (nm[2]==='b') freq/=1.0595;
            freq*=Math.pow(2,parseInt(nm[3]||'3')-3);
            if (!isFinite(freq)||freq<=0) freq=tuningRoot;
          }
        }
        return freq;
      }

      const cases=[
        { input:'[type] Z99', expected:41.2, label:'Invalid note Z → falls back to root' },
        { input:'[type] A4', expected:null, label:'Valid A4 → resolves to ~440Hz' },
        { input:'[type] C#5', expected:null, label:'Valid C#5 → sharp resolves' },
        { input:'[type] Eb3', expected:null, label:'Valid Eb3 → flat resolves' },
        { input:'[type] 999', expected:41.2, label:'No note at all → fallback to root' },
      ];

      let allOk=true;
      for (const c of cases) {
        const freq=resolveNote(c.input);
        const hasNaN=isNaN(freq)||!isFinite(freq);
        if (hasNaN) {
          fail(`NaN escaped for: "${c.input}" → got ${freq}`);
          allOk=false;
        } else if (c.expected!==null && Math.abs(freq-c.expected)>5) {
          warn(`"${c.input}" → ${freq.toFixed(2)}Hz (expected ${c.expected})`);
        } else {
          pass(`"${c.input}" → ${freq.toFixed(2)}Hz — ${c.label}`);
        }
      }

      // Verify no NaN makes it into a buffer
      probe('Synthesising with resolved frequencies to check buffer integrity...');
      let bufferHasNaN=false;
      for (const c of cases) {
        const freq=resolveNote(c.input);
        const dur=0.1;
        const n=Math.floor(dur*sr);
        const d=new Float32Array(n);
        for (let i=0;i<n;i++) d[i]=Math.sin(2*Math.PI*freq*(i/sr));
        for (let i=0;i<n;i++) if (isNaN(d[i])) { bufferHasNaN=true; break; }
      }

      if (!bufferHasNaN) pass('No NaN values found in any synthesised buffer');
      else fail('NaN found in synthesised buffer — guard incomplete');

      return allOk;
    }
  },
  {
    id:'sample-loading',
    name:'Sample Loading Pipeline',
    async run() {
      logHead('SUITE: Sample Loading Pipeline');
      initAudio();

      const slots=Object.keys(loadedSamples);
      if (slots.length===0) {
        warn('No samples loaded — drop audio files onto the left panel to test this suite');
        info('Tests will run once you drop your samples in');
        return null; // not fail, just skipped
      }

      let ok=true;
      for (const slot of slots) {
        const buf=loadedSamples[slot];
        info(`Testing sample: ${slot} (${buf.numberOfChannels}ch, ${buf.sampleRate}Hz, ${buf.duration.toFixed(2)}s)`);

        // 1. Buffer integrity
        const data=buf.getChannelData(0);
        let hasNaN=false;
        for (let i=0;i<data.length;i++) if (isNaN(data[i])) { hasNaN=true; break; }
        if (hasNaN) { fail(`${slot}: Buffer contains NaN`); ok=false; continue; }
        pass(`${slot}: Buffer is clean (no NaN)`);

        // 2. Peak level (should be audible)
        const pk=peakLevel(data);
        if (pk<0.001) { warn(`${slot}: Peak very low (${pk.toFixed(5)}) — may be silence`); }
        else pass(`${slot}: Peak level OK: ${pk.toFixed(3)}`);

        // 3. LUFS
        const lufs=measureLUFS(data);
        info(`${slot}: LUFS ≈ ${lufs.toFixed(1)} dB`);

        // 4. Sample rate conversion (the bug we fixed)
        if (buf.sampleRate !== audioCtx.sampleRate) {
          probe(`${slot}: Resampling ${buf.sampleRate}Hz → ${audioCtx.sampleRate}Hz (rate mismatch)...`);
          const resampled=resampleLinear(data, buf.sampleRate, audioCtx.sampleRate);
          const rsPeak=peakLevel(resampled);
          const rsLufs=measureLUFS(resampled);
          if (!isNaN(rsPeak) && rsPeak>0) {
            pass(`${slot}: Resampled OK — peak=${rsPeak.toFixed(3)}, LUFS=${rsLufs.toFixed(1)}`);

            // Duration should be proportional to rate change
            const expectedLen=Math.round(data.length*(audioCtx.sampleRate/buf.sampleRate));
            const lenError=Math.abs(resampled.length-expectedLen);
            if (lenError<10) pass(`${slot}: Resampled length correct (${resampled.length} samples)`);
            else warn(`${slot}: Resampled length off by ${lenError} samples`);
          } else {
            fail(`${slot}: Resampled buffer has bad peak: ${rsPeak}`);
            ok=false;
          }
        } else {
          pass(`${slot}: Sample rate matches context (${buf.sampleRate}Hz) — no conversion needed`);
        }

        // 5. Spectral centroid
        const centroid=measureSpectralCentroid(data, buf.sampleRate);
        if (centroid>0) {
          const target=757;
          const drift=Math.abs(centroid-target)/target;
          const driftStr=(drift*100).toFixed(1)+'%';
          if (drift<0.15) pass(`${slot}: Centroid ${centroid}Hz — ON TARGET (drift ${driftStr})`);
          else if (drift<0.35) warn(`${slot}: Centroid ${centroid}Hz — DRIFTING from 757Hz (${driftStr})`);
          else info(`${slot}: Centroid ${centroid}Hz — off target (${driftStr} from 757Hz)`);
        }
      }

      return ok;
    }
  },
  {
    id:'graph-topology',
    name:'CASH/ERUPTION Graph Topology',
    async run() {
      logHead('SUITE: CASH/ERUPTION Graph Topology (node cleanup fix)');
      initAudio();
      const ctx=audioCtx;

      // Build the same graph as the compiler
      function buildGraph() {
        const masterGain=ctx.createGain(); masterGain.gain.value=0.85;
        const masterLimiter=ctx.createDynamicsCompressor();
        masterLimiter.threshold.value=-1; masterLimiter.ratio.value=20;
        const masterComp=ctx.createDynamicsCompressor();
        masterComp.threshold.value=-12; masterComp.ratio.value=3;

        masterGain.connect(masterLimiter);
        masterLimiter.connect(masterComp);
        // NOTE: masterComp → analyser (not direct to destination, not doubled)
        const an=ctx.createAnalyser();
        masterComp.connect(an);

        const cashGain=ctx.createGain(); cashGain.gain.value=0.70;
        const eruptionGate=ctx.createGain(); eruptionGate.gain.value=0;
        const eruptionHP=ctx.createBiquadFilter(); eruptionHP.type='highpass'; eruptionHP.frequency.value=120;
        const eruptionFuzz=ctx.createWaveShaper();
        const eruptionLevel=ctx.createGain(); eruptionLevel.gain.value=0.30;

        cashGain.connect(masterGain);
        eruptionGate.connect(eruptionHP);
        eruptionHP.connect(eruptionFuzz);
        eruptionFuzz.connect(eruptionLevel);
        eruptionLevel.connect(masterGain);

        return { masterGain,masterLimiter,masterComp,cashGain,eruptionGate,eruptionHP,eruptionFuzz,eruptionLevel,an };
      }

      // Build graph twice (simulating re-compile) and verify cleanup
      const g1=buildGraph();
      pass('Graph 1 built: masterGain→limiter→comp→analyser');

      // Disconnect g1 (the fix)
      const nodes1=[g1.masterGain,g1.masterLimiter,g1.masterComp,g1.cashGain,
                    g1.eruptionGate,g1.eruptionHP,g1.eruptionFuzz,g1.eruptionLevel];
      let disconnectErrors=0;
      for (const n of nodes1) {
        try { n.disconnect(); }
        catch(e) { disconnectErrors++; }
      }
      if (disconnectErrors===0) pass('Graph 1 fully disconnected — no errors (orphan cleanup works)');
      else warn(`${disconnectErrors} disconnect errors on Graph 1 cleanup`);

      const g2=buildGraph();
      pass('Graph 2 built after cleanup — no leftover connections');

      // Verify ERUPTION gate starts silent
      const gateVal=g2.eruptionGate.gain.value;
      if (gateVal===0) pass(`ERUPTION gate starts at 0 (silent) — correct`);
      else fail(`ERUPTION gate starts at ${gateVal} (should be 0)`);

      // Verify HP floor on ERUPTION
      const hpFreq=g2.eruptionHP.frequency.value;
      if (hpFreq>=120) pass(`ERUPTION HP floor: ${hpFreq}Hz (≥120Hz minimum enforced)`);
      else fail(`ERUPTION HP floor too low: ${hpFreq}Hz`);

      // Verify the double-connection bug is NOT present
      // In the fix: masterGain does NOT connect directly to analyser
      // It routes: masterGain → masterLimiter → masterComp → analyser
      // So signal arrives at analyser exactly ONCE
      probe('Verifying no duplicate analyser connection (double-connection bug)...');
      // We can't directly query Web Audio connections, but we can verify
      // the topology doesn't have a direct masterGain→analyser path by
      // checking our build function doesn't create one
      const graphSrc = buildGraph.toString();
      const directConnectPattern = /masterGain\.connect\(an\)/;
      if (!directConnectPattern.test(graphSrc)) {
        pass('No direct masterGain→analyser connection (double-connection bug fixed)');
      } else {
        fail('Direct masterGain→analyser connection still present');
      }

      // Cleanup g2
      [g2.masterGain,g2.masterLimiter,g2.masterComp,g2.cashGain,
       g2.eruptionGate,g2.eruptionHP,g2.eruptionFuzz,g2.eruptionLevel
      ].forEach(n => { try { n.disconnect(); } catch(_) {} });
      pass('Graph 2 cleaned up after test');

      return true;
    }
  },
  {
    id:'lufs-calibration',
    name:'LUFS & Calibration',
    async run() {
      logHead('SUITE: LUFS, Mastering & Calibration');
      initAudio();
      const sr=audioCtx.sampleRate;

      // Generate a known-level signal and check LUFS measurement
      const dur=2.0;
      const n=Math.floor(dur*sr);
      const sig=new Float32Array(n);

      // -12 dBFS sine tone → expect LUFS near -12.7
      const amp=Math.pow(10,-12/20);
      for (let i=0;i<n;i++) sig[i]=Math.sin(2*Math.PI*440*(i/sr))*amp;
      const lufs=measureLUFS(sig);
      // Our estimator is simplified RMS (no K-weighting). For a sine wave this reads
      // ~3dB lower than full ITU-R BS.1770. That's expected — we only check it's
      // in a sensible range and that relative normalization is accurate.
      const lufsInRange=lufs>-30 && lufs<-5;
      if (lufsInRange) pass(`LUFS estimator in valid range: ${lufs.toFixed(2)} dB (simplified RMS, not K-weighted)`);
      else warn(`LUFS estimator out of expected range: ${lufs.toFixed(2)} dB`);

      // Normalise to each export preset target and verify
      const presets=[
        { name:'BeatStars', targetLUFS:-10 },
        { name:'Suno',      targetLUFS:-14 },
        { name:'Logic Pro', targetLUFS:-18 },
        { name:'Archive',   targetLUFS:-14 },
      ];

      for (const preset of presets) {
        const gain=Math.pow(10,(preset.targetLUFS-lufs)/20);
        const normalised=new Float32Array(n);
        for (let i=0;i<n;i++) normalised[i]=Math.max(-1,Math.min(1,sig[i]*gain));
        const achievedLUFS=measureLUFS(normalised);
        const error=Math.abs(achievedLUFS-preset.targetLUFS);
        if (error<1.0) pass(`${preset.name}: target ${preset.targetLUFS} LUFS → achieved ${achievedLUFS.toFixed(1)} LUFS`);
        else warn(`${preset.name}: LUFS error ${error.toFixed(1)} dB (got ${achievedLUFS.toFixed(1)}, wanted ${preset.targetLUFS})`);
      }

      // Peak limiter check
      const oversig=new Float32Array(n);
      for (let i=0;i<n;i++) oversig[i]=sig[i]*3; // push to +9dBFS
      const limited=new Float32Array(n);
      const ceil=Math.pow(10,-1/20);
      for (let i=0;i<n;i++) limited[i]=Math.abs(oversig[i])>ceil ? Math.sign(oversig[i])*ceil : oversig[i];
      const limitedPeak=peakLevel(limited);
      if (limitedPeak<=ceil+0.001) pass(`Limiter ceiling respected: peak=${limitedPeak.toFixed(4)} ≤ ${ceil.toFixed(4)}`);
      else fail(`Limiter ceiling breached: peak=${limitedPeak.toFixed(4)} > ${ceil.toFixed(4)}`);

      // Spectral centroid target check
      // GROUXX target is 757Hz — verify centroid measurement function works
      const tone440=new Float32Array(n);
      for (let i=0;i<n;i++) tone440[i]=Math.sin(2*Math.PI*440*(i/sr))*0.5;
      const c440=measureSpectralCentroid(tone440,sr);
      probe(`Centroid of 440Hz tone: ${c440}Hz (expected near 440)`);
      if (Math.abs(c440-440)<150) pass(`Centroid measurement tracks 440Hz tone (got ${c440}Hz)`);
      else warn(`Centroid measurement diverges from 440Hz: got ${c440}Hz`);

      return true;
    }
  }
];

// ─── SUITE RUNNER ─────────────────────────────────────────────────────────────
async function runAll() {
  if (running) return;
  running=true;
  stats={pass:0,fail:0,warn:0};
  $id('logArea').innerHTML='';
  $id('btnRun').disabled=true;
  $id('statVerdict').textContent='Running…';
  $id('statDur').textContent='—';
  const t0=Date.now();

  const items=document.querySelectorAll('.suite-item');

  for (let i=0;i<SUITES.length;i++) {
    const s=SUITES[i];
    const el=document.getElementById('si-'+s.id);
    if (el) { el.className='suite-item running'; el.querySelector('.suite-icon').textContent='⟳'; }
    $id('progressFill').style.width=((i/SUITES.length)*100)+'%';

    const t=Date.now();
    let result=true;
    try { result=await s.run(); }
    catch(e) { fail(`Suite "${s.name}" threw: ${e.message}`); result=false; }
    const elapsed=((Date.now()-t)/1000).toFixed(2)+'s';

    if (el) {
      el.querySelector('.suite-time').textContent=elapsed;
      if (result===true) {
        el.className='suite-item pass';
        el.querySelector('.suite-icon').textContent='✓';
      } else if (result===false) {
        el.className='suite-item fail';
        el.querySelector('.suite-icon').textContent='✗';
      } else {
        el.className='suite-item'; // skipped
        el.querySelector('.suite-icon').textContent='○';
      }
    }

    log('');
  }

  $id('progressFill').style.width='100%';
  const totalMs=Date.now()-t0;
  $id('statDur').textContent=(totalMs/1000).toFixed(1)+'s';

  const verdict=stats.fail===0 ? 'PASS ✓' : `FAIL (${stats.fail} failures)`;
  $id('statVerdict').textContent=verdict;
  $id('statVerdict').style.color=stats.fail===0 ? 'var(--green)' : 'var(--red)';

  log('='.repeat(54), 'head');
  log(`VERDICT: ${verdict} — ${stats.pass} passed, ${stats.fail} failed, ${stats.warn} warnings`, stats.fail===0 ? 'pass' : 'fail');

  running=false;
  $id('btnRun').disabled=false;
}

// ─── SUITE LIST RENDER ────────────────────────────────────────────────────────
function renderSuites() {
  const sl=$id('suiteList');
  sl.innerHTML='';
  for (const s of SUITES) {
    const el=document.createElement('div');
    el.id='si-'+s.id;
    el.className='suite-item';
    el.innerHTML=`<span class="suite-icon">○</span><span class="suite-name">${s.name}</span><span class="suite-time"></span>`;
    el.addEventListener('click', async () => {
      if (running) return;
      $id('logArea').innerHTML='';
      stats={pass:0,fail:0,warn:0};
      $id('statVerdict').textContent='Running…';
      running=true;
      $id('btnRun').disabled=true;
      el.className='suite-item running';
      el.querySelector('.suite-icon').textContent='⟳';
      const t=Date.now();
      let result=true;
      try { result=await s.run(); } catch(e) { fail('Suite threw: '+e.message); result=false; }
      const elapsed=((Date.now()-t)/1000).toFixed(2)+'s';
      el.querySelector('.suite-time').textContent=elapsed;
      el.className='suite-item '+(result===true?'pass':result===false?'fail':'');
      el.querySelector('.suite-icon').textContent=result===true?'✓':result===false?'✗':'○';
      $id('statVerdict').textContent=result===true?'PASS ✓':'FAIL';
      $id('statVerdict').style.color=result===true?'var(--green)':'var(--red)';
      $id('statDur').textContent=elapsed;
      running=false;
      $id('btnRun').disabled=false;
    });
    sl.appendChild(el);
  }
}

// ─── DROP ZONES ───────────────────────────────────────────────────────────────
function setupDropZones() {
  document.querySelectorAll('.drop-zone').forEach(zone => {
    const slot=zone.dataset.slot;

    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('over'));
    zone.addEventListener('drop', async e => {
      e.preventDefault();
      zone.classList.remove('over');
      const files=Array.from(e.dataTransfer.files).filter(f =>
        f.type.startsWith('audio/')||/\.(wav|mp3|aiff|flac)$/i.test(f.name)
      );
      if (!files.length) return;
      await loadSample(files[0], slot, zone);
    });

    zone.addEventListener('click', () => {
      const inp=document.createElement('input');
      inp.type='file'; inp.accept='audio/*';
      inp.onchange=async e => {
        if (e.target.files.length) await loadSample(e.target.files[0], slot, zone);
      };
      inp.click();
    });
  });
}

async function loadSample(file, slot, zone) {
  initAudio();
  zone.querySelector('.dz-label').textContent=file.name;
  zone.querySelector('.dz-sub').textContent='Loading…';
  zone.classList.remove('loaded','error-state');

  try {
    const ab=await file.arrayBuffer();
    const buf=await audioCtx.decodeAudioData(ab);
    loadedSamples[slot]=buf;

    zone.classList.add('loaded');
    zone.querySelector('.dz-label').textContent=file.name;
    zone.querySelector('.dz-sub').textContent=`${buf.duration.toFixed(1)}s / ${buf.sampleRate}Hz / ${buf.numberOfChannels}ch`;

    // Inject badge
    let badge=zone.querySelector('.dz-badge');
    if (!badge) { badge=document.createElement('span'); badge.className='dz-badge'; zone.appendChild(badge); }

    const needsResample=buf.sampleRate!==audioCtx.sampleRate;
    badge.className='dz-badge '+(needsResample?'badge-warn':'badge-ok');
    badge.textContent=needsResample?`RESAMPLE ${buf.sampleRate}→44100`:'RATE OK';

    log(`Loaded: ${file.name} (${slot}) — ${buf.sampleRate}Hz, ${buf.duration.toFixed(2)}s${needsResample?' [will be resampled]':''}`, 'pass');
  } catch(err) {
    zone.classList.add('error-state');
    zone.querySelector('.dz-sub').textContent='Decode failed — try WAV';
    let badge=zone.querySelector('.dz-badge');
    if (!badge) { badge=document.createElement('span'); badge.className='dz-badge'; zone.appendChild(badge); }
    badge.className='dz-badge badge-err'; badge.textContent='ERROR';
    log(`Failed to load ${file.name}: ${err.message}`, 'fail');
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
renderSuites();
setupDropZones();
$id('btnRun').addEventListener('click', runAll);

log('MELEGI Test Harness ready — drop samples on the left, click Run All Tests', 'info');
log('Click any suite name to run it individually', 'probe');
</script>
